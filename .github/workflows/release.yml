name: release

# Builds the BareProxy binaries, checks each one, and publishes them with a
# release.
#
# Releases go out on their own. When the test workflow passes on a push to
# main and the Version in src/internal/bp/server.go has no tag yet, this
# workflow builds the binaries from that commit and smoke-tests them on
# Linux (x86-64 and ARM), macOS and Windows. Only when every build and check
# passes does it tag the commit vX.Y.Z and publish the release "BareProxy
# vX.Y.Z" with the archives, SHA256SUMS and the version's CHANGELOG section.
#
# The archive names carry no version, so
# https://github.com/BareProxy/bareproxy/releases/latest/download/bareproxy_linux_amd64.tar.gz
# always gets the newest release.
#
# It also attaches binaries to a release someone publishes by hand, and it
# can be run by hand to rebuild the binaries of an existing tag.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, such as v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  plan:
    # After the tests, only for a push to main in this repository that passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      new: ${{ steps.plan.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
          workflow_run)
            # Only the commit main is at now; if main has moved on, the run
            # after the next push decides.
            head=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$head" != "$RUN_SHA" ]; then
              echo "No release: main has moved on from $RUN_SHA to $head."
              exit 0
            fi
            version=$(sed -n 's/^const Version = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' src/internal/bp/server.go)
            if [ -z "$version" ]; then
              echo "No release: the Version in src/internal/bp/server.go isn't of the form X.Y.Z."
              exit 0
            fi
            tags=$(git ls-remote --tags --refs origin) || { echo "Couldn't read the repository's tags" >&2; exit 1; }
            if grep -q "refs/tags/v$version\$" <<< "$tags"; then
              echo "No release: v$version is out already."
              exit 0
            fi
            newest=$({ grep -o 'refs/tags/v[0-9]*\.[0-9]*\.[0-9]*$' <<< "$tags" || true; } | sed 's|refs/tags/v||' | sort -V | tail -n 1)
            if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
              echo "v$version is older than the newest release, v$newest; raise the version above it" >&2
              exit 1
            fi
            echo "Releasing v$version from $RUN_SHA."
            { echo "tag=v$version"; echo "ref=$RUN_SHA"; echo "new=true"; } >> "$GITHUB_OUTPUT"
            ;;
          release)
            { echo "tag=$RELEASE_TAG"; echo "ref=$RELEASE_TAG"; } >> "$GITHUB_OUTPUT"
            ;;
          workflow_dispatch)
            { echo "tag=$INPUT_TAG"; echo "ref=$INPUT_TAG"; } >> "$GITHUB_OUTPUT"
            ;;
          esac

  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - name: Build every archive
        run: bash live/release.sh dist
      - name: Release notes from the CHANGELOG
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version=${TAG#v}
          awk -v v="$version" '
            /^## / { if (on) exit; if ($0 == "## " v || index($0, "## " v " ") == 1) { on = 1; next } }
            on { print }
          ' CHANGELOG.md > dist/changes.md
          {
            cat dist/changes.md
            echo
            echo "## Downloads"
            echo
            echo "| System | File |"
            echo "|---|---|"
            echo "| Linux, x86-64 (static) | bareproxy_linux_amd64.tar.gz |"
            echo "| Linux, 64-bit ARM (static) | bareproxy_linux_arm64.tar.gz |"
            echo "| macOS, Apple silicon | bareproxy_darwin_arm64.tar.gz |"
            echo "| macOS, Intel | bareproxy_darwin_amd64.tar.gz |"
            echo "| Windows, x86-64 | bareproxy_windows_amd64.zip |"
            echo
            echo "Each archive holds the \`bareproxy\` command with README.md, LICENSE and NOTICE. SHA256SUMS lists the checksums. The macOS binaries aren't signed by Apple, so macOS may ask you to allow them the first time, or run \`xattr -d com.apple.quarantine bareproxy\`."
          } > dist/notes.md
          rm dist/changes.md
          cat dist/notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  check-unix:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            archive: bareproxy_linux_amd64
          - runner: ubuntu-24.04-arm
            archive: bareproxy_linux_arm64
          - runner: macos-latest
            archive: bareproxy_darwin_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          sparse-checkout: live
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Checksum, unpack and smoke-test
        run: |
          (cd dist && grep ' ${{ matrix.archive }}.tar.gz$' SHA256SUMS | shasum -a 256 -c -)
          mkdir bin && tar -xzf dist/${{ matrix.archive }}.tar.gz -C bin
          file bin/${{ matrix.archive }}/bareproxy
          bash live/smoke.sh bin/${{ matrix.archive }}/bareproxy
      - if: runner.os == 'macOS'
        name: The Intel macOS binary is an x86-64 Mach-O
        run: |
          tar -xzf dist/bareproxy_darwin_amd64.tar.gz -C bin
          file bin/bareproxy_darwin_amd64/bareproxy | grep -q 'x86_64'

  check-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Unpack and smoke-test the Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $want = (Select-String -Path dist\SHA256SUMS -Pattern ' bareproxy_windows_amd64.zip$').Line.Split(' ')[0]
          $got = (Get-FileHash dist\bareproxy_windows_amd64.zip -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "checksum mismatch: $got" }
          Expand-Archive dist\bareproxy_windows_amd64.zip -DestinationPath bin
          $bp = (Resolve-Path bin\bareproxy_windows_amd64\bareproxy.exe).Path
          & $bp version
          New-Item -ItemType Directory smoke\public, smoke\run | Out-Null
          Set-Location smoke
          Set-Content public\index.html '<h1>smoke ok</h1>'
          @"
          global
            admin run/admin.sock
            state run/state
            trace-log run/requests.log

          site http://localhost:18080
            route /* -> files public
          "@ | Set-Content smoke.conf
          & $bp check smoke.conf
          $explain = (& $bp explain --offline -c smoke.conf GET http://localhost:18080/) -join "`n"
          Write-Output $explain
          if ($explain -notmatch 'public') { throw "explain didn't name the files folder" }
          $srv = Start-Process -FilePath $bp -ArgumentList 'run','smoke.conf' -PassThru -NoNewWindow -RedirectStandardError run\bareproxy.log
          $page = ''
          for ($i = 0; $i -lt 50 -and $page -notmatch 'smoke ok'; $i++) {
            Start-Sleep -Milliseconds 200
            $PSNativeCommandUseErrorActionPreference = $false
            $page = (curl.exe -fsS -H 'Host: localhost:18080' http://127.0.0.1:18080/ 2>$null) -join ''
            $PSNativeCommandUseErrorActionPreference = $true
          }
          if ($page -notmatch 'smoke ok') { Get-Content run\bareproxy.log; throw "the page didn't come back" }
          $code = curl.exe -s -o NUL -w '%{http_code}' -H 'Host: localhost:18080' http://127.0.0.1:18080/missing
          if ($code -ne '404') { throw "a missing page gave $code, not 404" }
          $status = (& $bp status -c smoke.conf) -join "`n"
          Write-Output $status
          if ($status -notmatch 'localhost') { throw "status didn't list the site" }
          Stop-Process -Id $srv.Id
          Write-Output "windows smoke test passed"

  release:
    needs: [plan, build, check-unix, check-windows]
    # Two runs for the same tag take turns; the second finds it published.
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      NEW: ${{ needs.plan.outputs.new }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Tag the commit and publish the release, binaries attached
        if: env.NEW == 'true'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is out already."
            exit 0
          fi
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" --latest \
            --title "BareProxy $TAG" --notes-file notes.md \
            bareproxy_linux_amd64.tar.gz bareproxy_linux_arm64.tar.gz bareproxy_darwin_arm64.tar.gz \
            bareproxy_darwin_amd64.tar.gz bareproxy_windows_amd64.zip SHA256SUMS
      - name: Attach the binaries to an existing release
        if: env.NEW != 'true'
        run: |
          cd dist
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            bareproxy_linux_amd64.tar.gz bareproxy_linux_arm64.tar.gz bareproxy_darwin_arm64.tar.gz \
            bareproxy_darwin_amd64.tar.gz bareproxy_windows_amd64.zip SHA256SUMS
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
