name: test

# Every push to main and every pull request: vet and test on Linux and macOS,
# the race detector on Linux, the vendored modules against the Go checksum
# database, and the browser demo's build. A green run on a push to main is
# what the release workflow waits for.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - run: go vet ./...
      - name: go test
        run: sh ../live/ci-test.sh -count=1 ./...
      - if: runner.os == 'Linux'
        name: go test -race
        run: sh ../live/ci-test.sh -race -count=1 ./...

  modules:
    # The vendored copies of golang.org/x/crypto, net and text came from
    # GitHub's mirror; this checks go.sum against the official module proxy
    # and checksum database, and that vendor/ matches go.mod.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - run: GOFLAGS=-mod=mod go mod download && GOFLAGS=-mod=mod go mod verify
      - run: |
          go mod vendor
          git diff --exit-code -- vendor || { echo "vendor/ doesn't match go.mod; run go mod vendor" >&2; exit 1; }

  plugins:
    # The Rust plugins: formatting, lints, their unit tests and a build to
    # WebAssembly, then the plugin host's tests again, with the Rust test
    # plugin as well as the Go one, and the shipped plugins in a server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - run: rustup target add wasm32-unknown-unknown && rustup component add rustfmt clippy
      - run: cargo fmt --check && cargo clippy --locked --release --target wasm32-unknown-unknown -- -D warnings
        working-directory: plugins
      - name: The plugins' unit tests
        run: cargo test --locked
        working-directory: plugins
      - run: bash plugins/build.sh plugins/dist
      - name: go test with the Rust test plugin and the shipped plugins
        working-directory: src
        env:
          BP_RUST_FIXTURE: ${{ github.workspace }}/plugins/dist/testplugin.wasm
          BP_PLUGINS_DIST: ${{ github.workspace }}/plugins/dist
        run: sh ../live/ci-test.sh -count=1 ./internal/plugin/... ./internal/bp/...

  builds:
    # Every release target and the browser demo build from this commit, and
    # the Linux binary passes the smoke test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - run: bash live/release.sh dist
      - run: sh src/cmd/bareproxy-wasm/build.sh dist/demo
      - name: Smoke test
        run: |
          mkdir bin && tar -xzf dist/bareproxy_linux_amd64.tar.gz -C bin
          bash live/smoke.sh bin/bareproxy_linux_amd64/bareproxy
