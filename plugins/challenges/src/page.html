<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>One moment</title>
<style>body{font:18px/1.5 system-ui,sans-serif;max-width:32em;margin:15vh auto;padding:0 1em;color:#222;background:#fff}@media (prefers-color-scheme:dark){body{color:#ddd;background:#111}}#s{color:#777}</style>
</head>
<body>
<h1>One moment</h1>
<p>This site asks each browser to solve a small puzzle before it serves pages. It keeps scrapers out, and it happens once.</p>
<p id="s">Working on it.</p>
<noscript><p>The puzzle needs JavaScript. Please turn it on and reload the page.</p></noscript>
<script type="application/json" id="bp-challenge">{{DATA}}</script>
<script>
(function () {
  // The puzzle: find n so that SHA-256 of c + ":" + n starts with w zero
  // bits. c is 64 characters, exactly one block, so its state is worked
  // out once and each try hashes only the block with n in it.
  var d = JSON.parse(document.getElementById("bp-challenge").textContent);
  var K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];
  var W = new Int32Array(64);
  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
  function block(h) {
    var i, a, b, c, e, f, g, k, t1, t2;
    for (i = 16; i < 64; i++) {
      a = W[i - 15]; b = W[i - 2];
      W[i] = (W[i - 16] + (rotr(a, 7) ^ rotr(a, 18) ^ (a >>> 3)) + W[i - 7] +
        (rotr(b, 17) ^ rotr(b, 19) ^ (b >>> 10))) | 0;
    }
    a = h[0]; b = h[1]; c = h[2]; k = h[3]; e = h[4]; f = h[5]; g = h[6]; t2 = h[7];
    for (i = 0; i < 64; i++) {
      t1 = (t2 + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      t2 = g; g = f; f = e; e = (k + t1) | 0; k = c; c = b; b = a;
      a = (t1 + (rotr(b, 2) ^ rotr(b, 13) ^ rotr(b, 22)) + ((b & c) ^ (b & k) ^ (c & k))) | 0;
    }
    h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + k) | 0;
    h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + t2) | 0;
  }
  function fill(s) {
    var i;
    for (i = 0; i < 16; i++) W[i] = 0;
    for (i = 0; i < s.length; i++) W[i >> 2] |= s.charCodeAt(i) << (24 - (i & 3) * 8);
    return s.length;
  }
  var mid = new Int32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
    0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
  fill(d.c);
  block(mid);
  var h = new Int32Array(8), n = 0, shift = 32 - d.w, s = document.getElementById("s");
  function hash(n) {
    var len = fill(":" + n);
    W[len >> 2] |= 0x80 << (24 - (len & 3) * 8);
    W[15] = (64 + len) * 8;
    h.set(mid);
    block(h);
    return h;
  }
  window.bpChallengeHash = hash;
  function run() {
    for (var end = n + 20000; n < end; n++) {
      if ((hash(n)[0] >>> shift) === 0) {
        s.textContent = "Done. Loading the page.";
        location.replace(d.e + "?t=" + d.t + "&w=" + d.w + "&n=" + n + "&r=" + encodeURIComponent(d.r));
        return;
      }
    }
    s.textContent = "Working on it: " + n.toLocaleString() + " tries.";
    setTimeout(run, 0);
  }
  if (!d.test) setTimeout(run, 0);
})();
</script>
</body>
</html>
